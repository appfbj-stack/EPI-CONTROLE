<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Shield Badge Outline -->
  <path d="M256 70 C340 70, 390 90, 420 120 C420 270, 350 380, 256 440 C162 380, 92 270, 92 120 C122 90, 172 70, 256 70 Z" 
        fill="#1e293b" 
        stroke="#334155" 
        stroke-width="12" 
        filter="url(#shadow)" />

  <!-- Inner Hard Hat Emblem -->
  <!-- Hat Dome -->
  <path d="M156 260 C156 170, 356 170, 356 260 Z" fill="url(#hatGrad)" filter="url(#shadow)" />
  
  <!-- Hat Crown Ridge -->
  <path d="M242 165 C242 165, 256 155, 270 165 L270 260 L242 260 Z" fill="#b45309" opacity="0.4" />
  
  <!-- Hat Brim -->
  <path d="M130 260 C130 252, 145 250, 160 250 L352 250 C367 250, 382 252, 382 260 C382 272, 360 280, 256 280 C152 280, 130 272, 130 260 Z" fill="#f59e0b" />
  
  <!-- Suspension / Chin-strap connector -->
  <rect x="238" y="278" width="36" height="12" rx="4" fill="#78350f" />

  <!-- Small Checkmark of Compliance -->
  <circle cx="340" cy="330" r="38" fill="url(#shieldGrad)" stroke="#0f172a" stroke-width="8" filter="url(#shadow)" />
  <path d="M326 330 L336 340 L356 320" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Label 'EPI' -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">GESTOR EPI</text>
  <text x="256" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="2">NR-6</text>
</svg>
